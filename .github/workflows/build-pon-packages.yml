# ============================================================
# GPON 测试: PON 包快速编译工作流
# 仅编译 kmod-airoha-xpon + luci-app-pon 及其依赖包
# 不编译完整固件, 用于 GPON 改造迭代测试
# feeds 源由 PonWrt 的 AN7581-gpon 分支自带 (pon_drivers / pon_userspace 指向含
# GPON 兼容性改造的 fork)，本仓库不再放 feeds.conf.default 覆盖，避免源码与编译耦合
# ============================================================

name: Build PON Packages (AN7581 GPON)
on:
  workflow_dispatch:

env:
  REPO_URL: https://github.com/DenzelVicent/ponwrt.git
  # 须与 GPON 固件源码分支一致, 否则 kmod 与固件内核 ABI 不匹配
  REPO_BRANCH: AN7581-gpon
  CONFIG_FILE: .config
  SELF_BEFORE_SH: before-update-custom.sh
  SELF_AFTER_SH: after-update-custom.sh
  TZ: Asia/Shanghai
  # 可选覆盖：本仓库根目录存在该文件时才 mv 覆盖源码自带 feeds，当前不存在
  FEEDS_CONF: feeds.conf.default

jobs:
  build-packages:
    name: build-pon-packages
    runs-on: ubuntu-24.04

    permissions:
      actions: write
      contents: write

    steps:
    # ----------------------------------------------------------
    # 步骤 1: 释放磁盘空间
    # ----------------------------------------------------------
    - name: Free disk space (Ubuntu)
      uses: jlumbroso/free-disk-space@main
      with:
        tool-cache: false
        android: true
        dotnet: true
        haskell: true
        large-packages: true
        swap-storage: false

    # ----------------------------------------------------------
    # 步骤 2: 检出本仓库代码
    # ----------------------------------------------------------
    - name: Checkout
      uses: actions/checkout@main

    # ----------------------------------------------------------
    # 步骤 3: 安装编译依赖
    # ----------------------------------------------------------
    - name: Install build dependencies
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          asciidoc autoconf automake autopoint binutils bison build-essential \
          bzip2 ccache clang cmake cpio curl device-tree-compiler flex gawk \
          gettext git g++-multilib gcc-multilib gperf help2man intltool \
          libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev \
          libmpfr-dev libncurses-dev libpython3-dev libreadline-dev libssl-dev \
          libtool libyaml-dev lld llvm ninja-build p7zip-full patch pkgconf \
          python3 python3-docutils python3-pip python3-ply python3-pyelftools \
          qemu-utils re2c rsync scons squashfs-tools subversion swig texinfo \
          uglifyjs unzip wget xmlto xxd zlib1g-dev zstd
        sudo -E apt-get -qq autoremove --purge
        sudo -E apt-get -qq clean
        sudo timedatectl set-timezone "$TZ"
        sudo mkdir -p /srcdir
        sudo chown $USER:$GROUPS /srcdir

    # ----------------------------------------------------------
    # 步骤 4: 克隆 PonWrt 源码
    # ----------------------------------------------------------
    - name: Clone source code
      working-directory: /srcdir
      run: |
        echo "Free space:"
        df -hT $PWD
        git clone $REPO_URL -b $REPO_BRANCH openwrt
        ln -sf /srcdir/openwrt $GITHUB_WORKSPACE/openwrt

    # ----------------------------------------------------------
    # 步骤 5: 缓存下载目录 (dl/) + ccache
    # key 里的 feeds.conf.default 当前不存在，hashFiles 对缺失项返回空串，
    # 删掉该文件只让 key 变一次；restore-keys 前缀命中旧缓存，不会冷下载
    # ----------------------------------------------------------
    - name: Cache downloads
      uses: actions/cache@v4
      with:
        path: openwrt/dl
        key: gpon-dl-${{ hashFiles('feeds.conf.default', '.config') }}
        restore-keys: |
          gpon-dl-

    - name: Cache ccache
      uses: actions/cache@v4
      with:
        path: ~/.ccache
        key: gpon-ccache-${{ hashFiles('.config') }}
        restore-keys: |
          gpon-ccache-

    # ----------------------------------------------------------
    # 步骤 6: 加载 feeds 源
    # feeds 由 PonWrt AN7581-gpon 分支自带（含 GPON fork 的 pon_drivers /
    # pon_userspace）；本仓库根目录若存在 feeds.conf.default 才会覆盖它
    # ----------------------------------------------------------
    - name: Load custom feeds
      run: |
        [ -e $FEEDS_CONF ] && mv $FEEDS_CONF openwrt/feeds.conf.default
        chmod +x $SELF_BEFORE_SH
        cd openwrt
        $GITHUB_WORKSPACE/$SELF_BEFORE_SH

    # ----------------------------------------------------------
    # 步骤 7: 更新 feeds
    # ----------------------------------------------------------
    - name: Update feeds
      run: cd openwrt && ./scripts/feeds update -a

    # ----------------------------------------------------------
    # 步骤 8: 安装 feeds
    # ----------------------------------------------------------
    - name: Install feeds
      run: cd openwrt && ./scripts/feeds install -a

    # ----------------------------------------------------------
    # 步骤 9: 克隆第三方包
    # ----------------------------------------------------------
    - name: Clone custom packages
      working-directory: openwrt
      run: |
        git clone --depth 1 https://github.com/gdy666/luci-app-lucky.git package/luci-app-lucky || {
            echo "::warning::luci-app-lucky 克隆失败"
        }
        git clone --depth 1 https://github.com/DenzelVicent/luci-app-airoha-npu.git package/luci-app-airoha-npu || {
            echo "::error::luci-app-airoha-npu 克隆失败"
        }

    # ----------------------------------------------------------
    # 步骤 10: 加载编译配置
    # ----------------------------------------------------------
    - name: Load custom config
      run: |
        [ -e files ] && mv files openwrt/files
        [ -e $CONFIG_FILE ] && mv $CONFIG_FILE openwrt/.config
        chmod +x $SELF_AFTER_SH
        cd openwrt
        make defconfig
        $GITHUB_WORKSPACE/$SELF_AFTER_SH

    # ----------------------------------------------------------
    # 步骤 11: 下载源码包
    # ----------------------------------------------------------
    - name: Download package
      run: |
        cd openwrt
        make download -j8 V=11
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -f {} \;

    # ----------------------------------------------------------
    # 步骤 12: 仅编译 PON 相关包
    # 编译工具链和目标包及其依赖, 不编译完整固件
    # ----------------------------------------------------------
    - name: Compile PON packages
      id: compile
      run: |
        cd openwrt
        echo "=== 编译工具链 ==="
        make toolchain/install -j$(nproc) CONFIG_CCACHE=y || make toolchain/install -j1 CONFIG_CCACHE=y || exit 1
        echo "=== 编译内核 (kmod 依赖) ==="
        make target/linux/compile -j$(nproc) V=s CONFIG_CCACHE=y || \
        make target/linux/compile -j1 V=s CONFIG_CCACHE=y || exit 1
        echo "=== 编译 kmod-airoha-xpon ==="
        make package/feeds/pon_drivers/airoha-xpon/compile -j$(nproc) V=s CONFIG_CCACHE=y || \
        make package/feeds/pon_drivers/airoha-xpon/compile -j1 V=s CONFIG_CCACHE=y || exit 1
        echo "=== 编译 kmod-airoha-pon-frontend ==="
        make package/feeds/pon_drivers/airoha-pon-frontends/compile -j$(nproc) V=s CONFIG_CCACHE=y || \
        make package/feeds/pon_drivers/airoha-pon-frontends/compile -j1 V=s CONFIG_CCACHE=y || exit 1
        echo "=== 编译 airoha-ponctl ==="
        make package/feeds/pon_userspace/airoha-ponctl/compile -j$(nproc) V=s CONFIG_CCACHE=y || \
        make package/feeds/pon_userspace/airoha-ponctl/compile -j1 V=s CONFIG_CCACHE=y || exit 1
        echo "=== 编译 airoha-pond ==="
        make package/feeds/pon_userspace/airoha-pon-daemons/compile -j$(nproc) V=s CONFIG_CCACHE=y || \
        make package/feeds/pon_userspace/airoha-pon-daemons/compile -j1 V=s CONFIG_CCACHE=y || exit 1
        echo "=== 编译 airoha-pon-debug ==="
        make package/feeds/pon_userspace/airoha-pon-debug/compile -j$(nproc) V=s CONFIG_CCACHE=y || \
        make package/feeds/pon_userspace/airoha-pon-debug/compile -j1 V=s CONFIG_CCACHE=y || exit 1
        echo "=== 编译 luci-app-pon (含 zh-cn 翻译) ==="
        make package/feeds/pon_userspace/luci-app-pon/compile -j$(nproc) V=s || \
        make package/feeds/pon_userspace/luci-app-pon/compile -j1 V=s || exit 1
        echo "status=success" >> $GITHUB_OUTPUT

    # ----------------------------------------------------------
    # 步骤 13: 收集 .apk 包文件
    # ----------------------------------------------------------
    - name: Collect APK packages
      id: collect
      if: steps.compile.outputs.status == 'success' && !cancelled()
      run: |
        # 清除旧包, 只保留本次编译产物
        find pon-packages/ -name "*.apk" -delete 2>/dev/null || true
        mkdir -p pon-packages
        # 从 bin/packages/ 和 bin/targets/ 收集 PON 相关 .apk
        find openwrt/bin/ -name "*.apk" | while read f; do
          name=$(basename "$f")
          case "$name" in
            *airoha-xpon*|*airoha-pon*|*luci-app-pon*|*luci-i18n-pon*)
              cp "$f" pon-packages/
              ;;
          esac
        done
        echo "=== 收集的包文件 ==="
        ls -lh pon-packages/
        if [ -z "$(ls -A pon-packages/)" ]; then
          echo "::error::未找到任何 .apk 包文件"
          exit 1
        fi
        echo "status=success" >> $GITHUB_OUTPUT

    # ----------------------------------------------------------
    # 步骤 14: 提交包文件到仓库 pon-packages/ 目录
    # ----------------------------------------------------------
    - name: Commit packages to repo
      if: steps.collect.outputs.status == 'success' && !cancelled()
      run: |
        # 安全检查: 禁止向 master 推送编译产物
        BRANCH="${GITHUB_REF_NAME}"
        if [ "$BRANCH" = "master" ]; then
          echo "::error::禁止向 master 分支推送编译产物"
          exit 1
        fi
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add -A pon-packages/
        git diff --cached --quiet && echo "无变更" && exit 0
        git commit -m "chore: 更新 PON 编译包"
        # 构建期间远程分支可能有新提交（CI 起点是快照），先拉取变基再推送。
        # --autostash 必需：步骤 10 用 mv 把仓库根目录被跟踪的 .config 移进 openwrt/，
        # 这条删除不属于产物提交，不自动暂存则 pull --rebase 报
        # "cannot pull with rebase: You have unstaged changes" 直接失败
        # （2026-10-13 构建产物提交 36abe9a 即因此未能推送）。
        git pull --rebase --autostash origin "$BRANCH"
        git push origin "$BRANCH"
