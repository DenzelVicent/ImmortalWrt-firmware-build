# ============================================================
# ImmortalWrt 固件编译工作流
# 支持机型: 小米 AX3000T / CMCC RAX3000M (MT7981 平台)
# 触发方式: 手动触发 (workflow_dispatch)
# ============================================================

name: Build ImmortalWrt Firmware (MT7981)
on:
  # 定时编译 (默认关闭，取消注释即可启用，cron 使用 UTC 时间)
  # schedule:
  #   - cron: "0 0 20 * *"
  # 手动触发：可在 GitHub Actions 页面点击 "Run workflow" 按钮
  workflow_dispatch:
    inputs:
      # ccache 编译对象缓存开关（和上面的选分支一样在触发表单里勾选）
      # 开启方式是把 CONFIG_CCACHE=y 追加进 openwrt/.config，而不是往 make 命令行传参数：
      # rules.mk 读的就是 .config 里的这个 make 变量，两条路最终等价，但传参数会让
      # "开关"和"Cache ccache 步骤"两处状态各写一次，容易改一漏一。
      # 关闭时 Cache ccache 步骤整体跳过，既不恢复也不保存 openwrt/.ccache。
      # 注意：boolean 的 default 只作用于网页表单；用 API 或 schedule 触发且未显式传 inputs
      # 时取到空值，等同于关闭缓存。
      use_dl_cache:
        description: 启用 dl 软件包源码下载缓存（改了 package 的源码版本/地址、或怀疑 dl 里是旧包时关掉）
        type: boolean
        default: true
      use_ccache:
        description: 启用 ccache 编译对象缓存（首次冷编译、或怀疑产物不对需排除 ccache 时关掉）
        type: boolean
        default: true

env:
  # 源码仓库地址 (hanwckf 的 MT798x ImmortalWrt 分支)
  REPO_URL: https://github.com/hanwckf/immortalwrt-mt798x.git
  # 源码分支 (openwrt-21.02 基于 OpenWrt 21.02)
  REPO_BRANCH: openwrt-21.02
  # 自定义固件配置文件 (OpenWrt make menuconfig 生成，按设备型号命名)
  # 工作流把它复制成 openwrt/.config；按型号命名是为了与"编译期真正的 .config"区分开
  CONFIG_FILE: mt7981.config
  # 缓存 key 的可读前缀：就是上面配置文件名去掉 .config 后缀，换设备时这两行成对一起改
  # (key 拼成 ${{ env.CONFIG_NAME }}-dl-<hash> / -ccache-<hash>)。
  # hashFiles 的参数按 GitHub 规定只能是字面量/glob、不接受变量，所以下面两条 key 里
  # 的配置文件名还得再同步一次。
  CONFIG_NAME: mt7981
  # feeds 更新前执行的自定义脚本 (可用于添加第三方软件源)
  SELF_BEFORE_SH: before-update-custom.sh
  # feeds 更新后执行的自定义脚本 (可用于修改默认 IP、DHCP 等配置)
  SELF_AFTER_SH: after-update-custom.sh
  # 编译环境时区
  TZ: Asia/Shanghai
  # 自定义 feeds 配置文件 (如存在则覆盖默认 feeds 源)
  FEEDS_CONF: feeds.conf.default

jobs:
  build:
    name: build-firmware
    runs-on: ubuntu-22.04

    permissions:
      actions: write    # 允许上传 artifact 与保存编译缓存

    steps:
    # ----------------------------------------------------------
    # 步骤 1: 释放磁盘空间
    # 删除 Ubuntu  runner 上不常用的工具链 (Android/.NET/Haskell 等)
    # 可释放约 6GB 空间，确保编译不会因磁盘不足而失败
    # ----------------------------------------------------------
    - name: Free disk space (Ubuntu)
      uses: jlumbroso/free-disk-space@main
      with:
        # 保留工具缓存，避免删除编译可能需要的工具
        tool-cache: false
        # 以下各项默认删除，可设为 false 保留
        android: true
        dotnet: true
        haskell: true
        large-packages: true
        swap-storage: false

    # ----------------------------------------------------------
    # 步骤 2: 检出本仓库代码
    # 将设备配置 mt7981.config、自定义脚本等文件拉取到工作区
    # ----------------------------------------------------------
    - name: Checkout
      uses: actions/checkout@main

    # ----------------------------------------------------------
    # 步骤 3: 初始化编译环境
    # 使用 ImmortalWrt 官方脚本安装所有编译依赖 (gcc、make、flex 等)
    # 设置时区为 Asia/Shanghai 使编译时间戳正确
    # ----------------------------------------------------------
    - name: Initialization environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        #  以下为手动安装依赖的方式 (已替换为官方一键脚本)
        #  sudo apt-get update
        #  sudo -E apt-get -qq install ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential \
        #    bzip2 ccache clang clangd cmake cpio curl device-tree-compiler ecj fastjar flex gawk gettext gcc-multilib \
        #    g++-multilib git gperf haveged help2man intltool lib32gcc-s1 libc6-dev-i386 libelf-dev libglib2.0-dev \
        #    libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses5-dev libreadline-dev \
        #    libssl-dev libtool lld lldb lrzsq mkisofs msmtp nano ninja-build p7zip p7zip-full patch pkgconf \
        #    python3 python3-pip python3-ply python3-docutils qemu-utils re2c rsync scons squashfs-tools subversion swig \
        #    texinfo uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev
        
        # 使用 ImmortalWRT 官方脚本一键安装编译环境
        sudo bash -c 'bash <(curl -sL https://build-scripts.immortalwrt.eu.org/init_build_environment.sh)'
        sudo -E apt-get -qq autoremove --purge
        sudo -E apt-get -qq clean
        sudo timedatectl set-timezone "$TZ"
        sudo mkdir -p /srcdir
        sudo chown $USER:$GROUPS /srcdir

    # ----------------------------------------------------------
    # 步骤 4: 克隆 ImmortalWrt 源码
    # 将源码克隆到 /srcdir 以获得更大的磁盘空间
    # 并通过软链接关联到工作区
    # ----------------------------------------------------------
    - name: Clone source code
      working-directory: /srcdir
      run: |
        echo "Free space:"
        df -hT $PWD
        git clone $REPO_URL -b $REPO_BRANCH openwrt
        ln -sf /srcdir/openwrt $GITHUB_WORKSPACE/openwrt

    # ----------------------------------------------------------
    # 步骤 5: 加载自定义 feeds 源
    # 如果仓库中存在 feeds.conf.default 则覆盖源码默认值
    # 然后执行 before-update-custom.sh (可添加第三方 feed)
    # ----------------------------------------------------------
    - name: Load custom feeds
      run: |
        [ -e $FEEDS_CONF ] && mv $FEEDS_CONF openwrt/feeds.conf.default
        chmod +x $SELF_BEFORE_SH
        cd openwrt
        $GITHUB_WORKSPACE/$SELF_BEFORE_SH

    # ----------------------------------------------------------
    # 步骤 6: 更新 feeds
    # 从各 feed 源拉取最新的软件包定义
    # ----------------------------------------------------------
    - name: Update feeds
      run: cd openwrt && ./scripts/feeds update -a

    # ----------------------------------------------------------
    # 步骤 7: 安装 feeds
    # 将更新后的 feed 软件包安装到编译环境中
    # ----------------------------------------------------------
    - name: Install feeds
      run: cd openwrt && ./scripts/feeds install -a

    # ----------------------------------------------------------
    # 步骤 8: 加载自定义配置
    # 将设备配置复制为 openwrt/.config 作为编译配置（用 cp 不用 mv：留着仓库根那份
    # 在工作区里，后面若还要排查 key 或复跑步骤都还能看到原始输入）
    # 触发表单勾选 use_ccache 时，在这里追加 CONFIG_CCACHE=y，make 命令行不再带参数
    # 如果存在 files/ 目录则复制到 openwrt/files/ 作为固件内预置文件
    # 最后执行 after-update-custom.sh (修改默认 IP、DHCP 范围等)
    # ----------------------------------------------------------
    - name: Load custom config
      env:
        USE_CCACHE: ${{ inputs.use_ccache }}
      run: |
        [ -e files ] && mv files openwrt/files
        # 配置文件必须存在，缺了就报错退出。不要写成 [ -e $CONFIG_FILE ] && cp ... ：
        # Actions 默认 shell 是 bash -e，而 && 列表里失败的那个不是最后一个命令，
        # set -e 不会终止步骤（已实测：文件不存在时后续命令照跑）。
        # 后果是静默用源码仓库的默认配置编译到底，产出不含本项目软件包的固件还显示成功。
        if [ ! -e "$CONFIG_FILE" ]; then
          echo "::error::缺少编译配置文件 $CONFIG_FILE（应位于本仓库根目录，检查工作流 CONFIG_FILE 与分支上的文件名是否一致）"
          exit 1
        fi
        cp "$CONFIG_FILE" openwrt/.config
        # 缓存开关落在 .config 里：rules.mk 的 ifneq ($(CONFIG_CCACHE),) 读的就是这个变量，
        # 与从前在 make 行传 CONFIG_CCACHE=y 等价。21.02 的 config CCACHE 同样是
        # `bool "Use ccache" if DEVEL`，而 mt7981.config 第 53 行已有 CONFIG_DEVEL=y，
        # 符号可见，所以下一步的 make defconfig 不会丢掉它（那里有 grep 兜底自检）。
        # 用 printf 且前置 \n：本分支 mt7981.config 的末行没有换行符，直接追加会和
        # 最后一行粘成 CONFIG_PACKAGE_dnsmasq=nCONFIG_CCACHE=y 这样的无效行，
        # 被 kconfig 静默忽略、开关等于没开。
        if [ "$USE_CCACHE" = "true" ]; then
          printf '\n%s\n' 'CONFIG_CCACHE=y' >> openwrt/.config
        fi
        chmod +x $SELF_AFTER_SH
        cd openwrt
        $GITHUB_WORKSPACE/$SELF_AFTER_SH

    # ----------------------------------------------------------
    # 步骤 8.5: 缓存下载目录 (dl/)
    # 缓存软件包源码 tarball，加速重复构建；由触发表单的 use_dl_cache 控制
    #
    # key = ${{ env.CONFIG_NAME }} + -dl- + 配置内容哈希，前缀不再是写死的设备名。
    # 设备名前置（而不是跟在 immortalwrt- 这类公共前缀之后）是必须的：restore-keys 按字符串
    # 前缀匹配，`immortalwrt-dl-an7581-` 恰好是 `immortalwrt-dl-an7581-gpon-<hash>` 的前缀，
    # 两条分支就会互相命中对方缓存（缓存虽按分支隔离，但默认分支 master 创建的条目各分支都能恢复）。
    # 前置后 an7581- / an7581-gpon- / mt7981- 三组前缀互不为前缀。
    #
    # 前缀之后仍要拼 hashFiles：actions/cache 只在主 key 未精确命中时才保存缓存，
    # 纯常量 key 一旦命中就永久不再更新（改配置也不会失效），
    # "内容哈希 key + restore-keys 前缀"才是缓存能滚动更新的唯一通道。
    # 哈希参数取仓库根的设备配置文件，外加可选的 feeds.conf.default。后者本仓库当前没有，
    # hashFiles 对缺失项不产生任何贡献，所以它现在不参与计算；留着是为了以后真在根目录
    # 放入该文件时能自动让缓存失效——缓存步骤排在 Load custom feeds 的 mv 之前，那时
    # 根目录那份文件还在，取得到。
    #
    # 同一台设备改配置只换哈希、前缀不变，同分支的旧条目由 restore-keys 兜住，不会冷启动。
    # 开关关掉时 Clear dl cache if disabled 步骤会从 Actions 缓存存储里删除旧条目，
    # 防止下次打开开关时恢复到旧缓存。
    # ----------------------------------------------------------
    - name: Cache downloads
      if: ${{ inputs.use_dl_cache }}
      uses: actions/cache@v4
      with:
        path: openwrt/dl
        key: ${{ env.CONFIG_NAME }}-dl-${{ hashFiles('feeds.conf.default', 'mt7981.config') }}
        restore-keys: |
          ${{ env.CONFIG_NAME }}-dl-

    - name: Clear dl cache if disabled
      if: ${{ !inputs.use_dl_cache }}
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        # 开关关掉时从 Actions 缓存存储里删除旧条目，防止下次打开开关时恢复到旧缓存。
        # gh cache list 默认只返回 30 条，--limit 100 增加上限；通常一个仓库的缓存条目不会太多。
        gh cache list --limit 100 --json key,id | \
          jq -r '.[] | select(.key | startswith("${{ env.CONFIG_NAME }}-dl-")) | .id' | \
          xargs -r gh cache delete --yes

    # ----------------------------------------------------------
    # 步骤 9: 下载编译所需的软件包源码
    # make defconfig 根据 .config 生成完整配置
    # make download 预下载所有源码包，避免编译时网络超时
    # 清理小于 1024 字节的下载失败文件
    # ----------------------------------------------------------
    - name: Download package
      id: package
      env:
        USE_CCACHE: ${{ inputs.use_ccache }}
      run: |
        cd openwrt
        make defconfig
        # 兜底自检：开关被 defconfig 丢掉就直接失败，而不是白编一趟才发现命中率是 0
        if [ "$USE_CCACHE" = "true" ]; then
          grep -q '^CONFIG_CCACHE=y' .config || {
            echo "::error::CONFIG_CCACHE=y 没能进入 defconfig 结果，检查 $CONFIG_FILE 里是否有 CONFIG_DEVEL=y"
            exit 1
          }
        fi
        make download -j8 V=11
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -f {} \;

    # ----------------------------------------------------------
    # 步骤 10: 编译固件
    # 优先使用全部 CPU 核心并行编译，失败后回退到单线程
    # 单线程仍失败则开启详细日志 (V=s) 便于排查
    # 编译产物包含 AX3000T 和 RAX3000M 两个机型的所有变体
    #
    # ccache 路径必须是 openwrt/.ccache，不能写 ~/.ccache：
    # 源码是 hanwckf/immortalwrt-mt798x (openwrt-21.02)，其 rules.mk 里
    # CCACHE_DIR 默认取 $(TOPDIR)/.ccache，而本分支 mt7981.config 只有 CONFIG_DEVEL=y、
    # 未设 CONFIG_CCACHE_DIR，所以编译实际写入的是 openwrt/.ccache。
    # 此前缓存 ~/.ccache 时两边不是同一目录，命中率恒为 0，白付 ccache 开销。
    # 命中率看构建日志末尾的 `ccache -s`（Makefile world 目标自带）。
    #
    # key 改成哈希仓库根的 mt7981.config（原先哈希的是 openwrt/.config）：
    # 那是被 defconfig 展开后的完整结果，会随 feed 内容一起变，而 openwrt 本身还是
    # 指向 /srcdir/openwrt 的符号链接，能不能取到没有日志可证。哈希仓库里的输入文件
    # 语义才明确——改本仓库配置才换 key；同分支旧 key 由 restore-keys 前缀兜住，不会冷启动。
    # key = ${{ env.CONFIG_NAME }}-ccache- + 配置内容哈希；CONFIG_NAME 与 CONFIG_FILE 在 env 段
    # 成对定义（配置文件名去掉 .config 后缀），换设备只改那两行。hashFiles 的参数按 GitHub
    # 规定只能是字面量/glob、不接受变量，所以下面 key 里的文件名还得同步改。
    # 设备名前置是为了不去命中 AN7581 两个工作流的 restore-keys（道理见那两份步骤 5 的说明）。
    # 这里不带 AN7581 那两个工作流里的 feeds.conf.default：本分支的缓存步骤排在
    # Load custom feeds 的 mv 之后，根目录那份（若存在）此时已被移走，哈希不到。
    # 开关关掉时 Clear ccache if disabled 步骤会从 Actions 缓存存储里删除旧条目，
    # 防止下次打开开关时恢复到旧缓存。
    # ----------------------------------------------------------
    - name: Cache ccache
      if: ${{ inputs.use_ccache }}
      uses: actions/cache@v4
      with:
        path: openwrt/.ccache
        key: ${{ env.CONFIG_NAME }}-ccache-${{ hashFiles('mt7981.config') }}
        restore-keys: |
          ${{ env.CONFIG_NAME }}-ccache-

    - name: Clear ccache if disabled
      if: ${{ !inputs.use_ccache }}
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        # 开关关掉时从 Actions 缓存存储里删除旧条目，防止下次打开开关时恢复到旧缓存。
        gh cache list --limit 100 --json key,id | \
          jq -r '.[] | select(.key | startswith("${{ env.CONFIG_NAME }}-ccache-")) | .id' | \
          xargs -r gh cache delete --yes

    - name: Compile the firmware
      id: compile
      run: |
        cd openwrt
        echo -e "$(nproc) thread compile"
        # 命令行不再传 CONFIG_CCACHE=y：开关已由步骤 8 按触发表单写进 .config，
        # 回退的三条 make 都读同一份 .config，不必各带一遍参数
        make -j$(nproc) || make -j1 || make -j1 V=s
        echo "status=success" >> $GITHUB_OUTPUT
        
        echo "FILE_DATE=_$(date +"%Y%m%d%H%M")" >> $GITHUB_ENV

    # ----------------------------------------------------------
    # 步骤 11: 检查磁盘使用情况 (无论成功失败都执行)
    # ----------------------------------------------------------
    - name: Check space usage
      if: (!cancelled())
      run: df -hT

    # ----------------------------------------------------------
    # 步骤 12: 整理固件文件
    # 删除 targets 目录下的 packages 子目录 (减小发布体积)
    # 删除 manifest/buildinfo/校验和等非固件附属文件
    # 按硬件型号将固件分目录存放到 release/<型号>/
    # 型号 = profile 去掉 -stock 后缀, 同一硬件的 standard 与 stock 镜像同目录
    # ----------------------------------------------------------
    - name: Organize files
      id: organize
      if: (!cancelled())
      run: |
        cd openwrt/bin/targets/*/*
        rm -rf packages
        find . -maxdepth 1 -type f ! -name '*.bin' ! -name '*.itb' -delete
        # 固件文件名形如 immortalwrt-<target>-<subtarget>-<profile>-<类型>.bin
        prefix="immortalwrt-$(basename "$(dirname "$PWD")")-$(basename "$PWD")-"
        for f in *.bin *.itb; do
          [ -e "$f" ] || continue
          base="${f#"$prefix"}"
          prof="${base%-initramfs-kernel.bin}"
          prof="${prof%-squashfs-sysupgrade.bin}"
          prof="${prof%-squashfs-factory.bin}"
          model="${prof%-stock}"
          mkdir -p "$GITHUB_WORKSPACE/release/$model"
          mv "$f" "$GITHUB_WORKSPACE/release/$model/"
        done
        echo "status=success" >> $GITHUB_OUTPUT

    # ----------------------------------------------------------
    # 步骤 13: 按硬件型号上传固件散文件目录为 artifact
    # 每个型号一个独立 artifact, 下载后直接是各固件 bin, 便于单独取用
    # 与 Release 附件 (tar.zst 整包) 形态不同: artifact 供挑文件, Release 供整包下载
    # tar.zst 打包移至下方 release job 下载 artifact 后统一执行
    # 型号目录不存在时 (mt7981.config 未启用该设备) 跳过对应上传
    # ----------------------------------------------------------
    - name: Upload firmware xiaomi_mi-router-ax3000t
      uses: actions/upload-artifact@main
      if: steps.organize.outputs.status == 'success' && hashFiles('release/xiaomi_mi-router-ax3000t/*') != '' && !cancelled()
      with:
        name: ImmortalWrt_firmware_xiaomi_mi-router-ax3000t${{ env.FILE_DATE }}
        path: release/xiaomi_mi-router-ax3000t

    - name: Upload firmware xiaomi_mi-router-ax3000t-an8855
      uses: actions/upload-artifact@main
      if: steps.organize.outputs.status == 'success' && hashFiles('release/xiaomi_mi-router-ax3000t-an8855/*') != '' && !cancelled()
      with:
        name: ImmortalWrt_firmware_xiaomi_mi-router-ax3000t-an8855${{ env.FILE_DATE }}
        path: release/xiaomi_mi-router-ax3000t-an8855

    - name: Upload firmware cmcc_rax3000m
      uses: actions/upload-artifact@main
      if: steps.organize.outputs.status == 'success' && hashFiles('release/cmcc_rax3000m/*') != '' && !cancelled()
      with:
        name: ImmortalWrt_firmware_cmcc_rax3000m${{ env.FILE_DATE }}
        path: release/cmcc_rax3000m

    - name: Upload firmware cmcc_rax3000m-emmc
      uses: actions/upload-artifact@main
      if: steps.organize.outputs.status == 'success' && hashFiles('release/cmcc_rax3000m-emmc/*') != '' && !cancelled()
      with:
        name: ImmortalWrt_firmware_cmcc_rax3000m-emmc${{ env.FILE_DATE }}
        path: release/cmcc_rax3000m-emmc

    # ----------------------------------------------------------
    # 步骤 14: 清理编译产物
    # make clean 清除编译中间文件，为缓存做准备
    # ----------------------------------------------------------
    - name: Clean Compile
      id: clean-compile
      run: |
        cd openwrt
        make clean

    # ----------------------------------------------------------
    # 步骤 15: 缓存编译目录
    # 缓存 openwrt 目录，下次编译可复用已编译的依赖
    # 缓存 key 基于 feeds.conf.default 的哈希值
    # ----------------------------------------------------------
    - name: Cache Compile
      id: cache-compile
      uses: actions/cache/save@v6
      if: steps.compile.outputs.status == 'success' && !cancelled()
      with:
        path: openwrt
        key: ${{ runner.os }}-openwrt-${{ hashFiles('openwrt/feeds.conf.default') }}

  # ------------------------------------------------------------
  # Release 发布 job
  # 编译完成后统一创建 Release, 与 U-Boot 工作流结构保持一致
  # ------------------------------------------------------------
  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: build
    if: needs.build.result == 'success' && !cancelled()

    permissions:
      contents: write   # 允许创建 Release
      actions: write    # 允许删除/管理 workflow runs

    steps:

      # ----------------------------------------------------------
      # 步骤 1: 下载本次 run 的全部 artifact
      # 不指定 name 时下载所有 artifact, 每个解压到以其名称命名的子目录
      # ----------------------------------------------------------
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      # ----------------------------------------------------------
      # 步骤 2: 将各型号散文件目录打包为 tar.zst 汇总到 release 目录
      # artifact 名格式 ImmortalWrt_firmware_<型号>_<日期>, 从中反解型号名
      # ----------------------------------------------------------
      - name: Package firmware by model
        run: |
          mkdir -p release
          for d in artifacts/*/; do
            [ -d "$d" ] || continue
            name="$(basename "$d")"
            model="$(echo "$name" | sed -E 's/^ImmortalWrt_firmware_//; s/_[0-9]{12}$//')"
            tar --zstd -cf "release/${model}.tar.zst" -C "$d" .
            echo "Packaged $model -> release/${model}.tar.zst"
          done
          ls -l release/

      # ----------------------------------------------------------
      # 步骤 3: 生成 Release 标签和说明
      # 标签格式: ImmortalWrt_年.月.日-时分
      # ----------------------------------------------------------
      - name: Generate release tag
        id: tag
        run: |
          echo "release_tag=ImmortalWrt_$(date +"%Y.%m.%d-%H%M")" >> $GITHUB_OUTPUT
          touch release.txt
          echo "ImmortalWrt for Xiaomi AX3000T & CMCC RAX3000M" >> release.txt
          echo "" >> release.txt
          echo "Supported devices:" >> release.txt
          echo "- Xiaomi Mi Router AX3000T (standard / stock / AN8855)" >> release.txt
          echo "- CMCC RAX3000M (SPI-NAND / eMMC)" >> release.txt
          echo "status=success" >> $GITHUB_OUTPUT

      # ----------------------------------------------------------
      # 步骤 4: 上传全部固件压缩包到 GitHub Release
      # ----------------------------------------------------------
      - name: Upload firmware to release
        id: release
        uses: softprops/action-gh-release@v3
        if: steps.tag.outputs.status == 'success' && !cancelled()
        with:
          tag_name: ${{ steps.tag.outputs.release_tag }}
          body_path: release.txt
          files: release/*.tar.zst
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ----------------------------------------------------------
      # 步骤 5: 清理旧的 workflow runs
      # 保留最近 7 天的运行记录，至少保留 3 条
      # ----------------------------------------------------------
      - name: Delete workflow runs
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          retain_days: 7
          keep_minimum_runs: 3

      # ----------------------------------------------------------
      # 步骤 6: 清理旧的 GitHub Releases
      # 保留最近 3 个 Release，删除旧的 Release 及其 tag
      # ----------------------------------------------------------
      - name: Remove old Releases
        uses: dev-drprasad/delete-older-releases@v0.3.4
        if: steps.release.outputs.status == 'success' && !cancelled()
        with:
          keep_latest: 3
          delete_tags: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
