# ============================================================
# ImmortalWrt GPON 固件编译工作流
# 支持机型: 由分支名决定 (AN7581-GPON → Nokia XG-040G-MD, AN7583-GPON → Nokia XG-040G-MF)
# 源码来源: https://github.com/DenzelVicent/ponwrt.git (分支名与本仓库分支同名)
# 触发方式: 手动触发 (workflow_dispatch)
# ============================================================

name: Build ImmortalWrt Firmware (AN7581 GPON)
on:
  # 定时编译 (默认关闭，取消注释即可启用，cron 使用 UTC 时间)
  # schedule:
  #   - cron: "0 21 * * *"
  workflow_dispatch:
    inputs:
      # 关闭时 Cache downloads 步骤整体跳过：既不恢复也不保存 openwrt/dl。
      # 什么时候需要关：改了某个 package 的源码版本或地址（Makefile 里的 PKG_VERSION /
      # PKG_SOURCE_VERSION / PKG_SOURCE_URL 等），而 dl 缓存里还留着同名旧包。
      # 这些字段不在 dl 缓存 key 的哈希范围内，改了它们缓存不会自动失效，
      # 只能靠这个开关绕过，或去 Actions 缓存列表删掉旧条目。
      # 注意：关闭只是"这一趟不读写缓存"，已保存的条目不会被删除，重新勾选就接着用；
      # 要彻底丢弃旧条目须到 仓库 Settings → Actions → Caches 手动删。
      use_dl_cache:
        description: 启用 dl 软件包源码下载缓存（改了 package 的源码版本/地址、或怀疑 dl 里是旧包时关掉）
        type: boolean
        default: true
      # 开启方式是把 CONFIG_CCACHE=y 追加进 openwrt/.config，而不是往 make 命令行传参数：
      # rules.mk 的 `ifneq ($(CONFIG_CCACHE),)` 读的就是 .config 里的这个 make 变量。
      # 关闭时 Cache ccache 步骤整体跳过，既不恢复也不保存 openwrt/.ccache。
      # 注意：boolean 的 default 只作用于网页表单；用 API 或 schedule 触发且未显式传 inputs
      # 时取空值，等同于关闭缓存。
      use_ccache:
        description: 启用 ccache 编译对象缓存（首次冷编译、或怀疑产物不对需排除 ccache 时关掉）
        type: boolean
        default: true

env:
  REPO_URL: https://github.com/DenzelVicent/ponwrt.git
  # 源码分支：自动取本仓库触发时的分支名，ponwrt 侧需有同名分支提供 GPON 内核 patch
  REPO_BRANCH: ${{ github.ref_name }}
  # 自定义固件配置文件，工作流把它复制成 openwrt/.config。
  # 注意：hashFiles 只接受字面量，所以这里和 cache key 里的文件名须保持一致。
  CONFIG_FILE: an7581-gpon.config
  # 缓存 key 的可读前缀：就是上面配置文件名去掉 .config 后缀，换设备时这两行成对一起改。
  # hashFiles 的参数按 GitHub 规定只能是字面量/glob、不接受变量，所以下面 cache key 里
  # 的配置文件名还得再同步一次。
  CONFIG_NAME: an7581-gpon
  SELF_BEFORE_SH: before-update-custom.sh
  SELF_AFTER_SH: after-update-custom.sh
  TZ: Asia/Shanghai
  # 可选覆盖：本仓库根目录存在该文件时才 mv 覆盖源码自带 feeds，当前不存在
  # (GPON 的 fork feed 源在 PonWrt 对应分支的 feeds.conf.default 里)
  FEEDS_CONF: feeds.conf.default

jobs:
  build:
    name: build-firmware
    runs-on: ubuntu-24.04
    permissions:
      actions: write

    steps:
    # 删除 Ubuntu runner 上不常用的工具链，释放约 6GB 空间
    - name: Free disk space (Ubuntu)
      uses: jlumbroso/free-disk-space@main
      with:
        tool-cache: false
        android: true
        dotnet: true
        haskell: true
        large-packages: true
        swap-storage: false

    - name: Checkout
      uses: actions/checkout@main

    # 根据分支名推导设备参数：AN758x-GPON → SoC (an7581/an7583) → 设备名 + 子目标
    # 新增 GPON 设备只需在 case 加一行 + 准备对应配置文件，工作流其余部分不用改
    - name: Setup device parameters
      run: |
        BRANCH="${{ github.ref_name }}"
        SOC="${BRANCH#AN758}"
        SOC="an758${SOC%%-*}"
        case "$SOC" in
          an7581) DEVICE_NAME="nokia-xg-040g-md" ;;
          an7583) DEVICE_NAME="nokia-xg-040g-mf" ;;
          *) echo "::error::未知 GPON 分支: $BRANCH，无法推导设备名"; exit 1 ;;
        esac
        echo "DEVICE_NAME=_${DEVICE_NAME}" >> $GITHUB_ENV
        echo "SUBTARGET=${SOC}" >> $GITHUB_ENV
        echo "DEVICE_MODEL=${DEVICE_NAME}" >> $GITHUB_ENV
        echo "Branch=$BRANCH SoC=$SOC Device=$DEVICE_NAME"

    - name: Install build dependencies
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          asciidoc autoconf automake autopoint binutils bison build-essential \
          bzip2 ccache clang cmake cpio curl device-tree-compiler flex gawk \
          gettext git g++-multilib gcc-multilib gperf help2man intltool \
          libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev \
          libmpfr-dev libncurses-dev libpython3-dev libreadline-dev libssl-dev \
          libtool libyaml-dev lld llvm ninja-build p7zip-full patch pkgconf \
          python3 python3-docutils python3-pip python3-ply python3-pyelftools \
          qemu-utils re2c rsync scons squashfs-tools subversion swig texinfo \
          uglifyjs unzip wget xmlto xxd zlib1g-dev zstd
        sudo -E apt-get -qq autoremove --purge
        sudo -E apt-get -qq clean
        sudo timedatectl set-timezone "$TZ"
        sudo mkdir -p /srcdir
        sudo chown $USER:$GROUPS /srcdir

    # 克隆到 /srcdir 获得更大磁盘空间，软链接关联到工作区
    # REPO_BRANCH 由 github.ref_name 驱动，本仓库分支名须与 ponwrt 分支名一致
    - name: Clone source code
      working-directory: /srcdir
      run: |
        echo "Free space:"
        df -hT $PWD
        git clone $REPO_URL -b $REPO_BRANCH openwrt
        ln -sf /srcdir/openwrt $GITHUB_WORKSPACE/openwrt

    # 缓存 dl/ (软件包源码) 和 .ccache (编译对象)，加速重复构建。
    # key = CONFIG_NAME + -dl-/-ccache- + 配置内容哈希；设备名前置防止前缀互相匹配。
    # 开关关掉时 Clear 步骤从 Actions 缓存存储删除旧条目，防止下次打开恢复到旧缓存。
    # ccache 路径必须是 openwrt/.ccache（rules.mk 的 CCACHE_DIR 默认取 $(TOPDIR)/.ccache），
    # 不能写 ~/.ccache，否则命中率恒为 0。
    - name: Cache downloads
      if: ${{ inputs.use_dl_cache }}
      uses: actions/cache@v4
      with:
        path: openwrt/dl
        key: ${{ env.CONFIG_NAME }}-dl-${{ hashFiles('feeds.conf.default', 'an7581-gpon.config') }}
        restore-keys: |
          ${{ env.CONFIG_NAME }}-dl-

    - name: Clear dl cache if disabled
      if: ${{ !inputs.use_dl_cache }}
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh cache list --limit 100 --json key,id | \
          jq -r '.[] | select(.key | startswith("${{ env.CONFIG_NAME }}-dl-")) | .id' | \
          xargs -r gh cache delete --yes

    - name: Cache ccache
      if: ${{ inputs.use_ccache }}
      uses: actions/cache@v4
      with:
        path: openwrt/.ccache
        key: ${{ env.CONFIG_NAME }}-ccache-${{ hashFiles('feeds.conf.default', 'an7581-gpon.config') }}
        restore-keys: |
          ${{ env.CONFIG_NAME }}-ccache-

    - name: Clear ccache if disabled
      if: ${{ !inputs.use_ccache }}
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh cache list --limit 100 --json key,id | \
          jq -r '.[] | select(.key | startswith("${{ env.CONFIG_NAME }}-ccache-")) | .id' | \
          xargs -r gh cache delete --yes

    # GPON 所需的 pon_drivers / pon_userspace 两个 fork 源由 PonWrt 对应分支自带，
    # 本仓库不放 feeds.conf.default 去覆盖；仅当根目录存在该文件时才 mv 覆盖
    - name: Load custom feeds
      run: |
        [ -e $FEEDS_CONF ] && mv $FEEDS_CONF openwrt/feeds.conf.default
        chmod +x $SELF_BEFORE_SH
        cd openwrt
        $GITHUB_WORKSPACE/$SELF_BEFORE_SH

    - name: Update feeds
      run: cd openwrt && ./scripts/feeds update -a

    - name: Install feeds
      run: cd openwrt && ./scripts/feeds install -a

    # 克隆第三方包 (非 feed 格式)，必须在 feeds install 之后：
    # 此时 luci-base 等 feed 包已安装为符号链接，make defconfig 才能正确解析依赖
    - name: Clone custom packages
      working-directory: openwrt
      run: |
        git clone --depth 1 https://github.com/gdy666/luci-app-lucky.git package/luci-app-lucky || {
            echo "::warning::luci-app-lucky 克隆失败，该插件将不会包含在固件中"
        }
        git clone --depth 1 https://github.com/DenzelVicent/luci-app-airoha-npu.git package/luci-app-airoha-npu || {
            echo "::error::luci-app-airoha-npu 克隆失败，NPU 管理界面将不会包含在固件中"
        }
        echo "=== 第三方包目录检查 ==="
        for d in package/luci-app-lucky package/luci-app-airoha-npu; do
            [ -d "$d" ] && echo "[OK] $d" || echo "[MISSING] $d"
        done

    # 加载仓库签名密钥 (APK)，需在 Settings → Secrets 配置 PONWRT_APK_PRIVATE_KEY
    - name: Load repository signing key
      working-directory: openwrt
      env:
        PONWRT_APK_PRIVATE_KEY: ${{ secrets.PONWRT_APK_PRIVATE_KEY }}
      run: |
        if [ -n "$PONWRT_APK_PRIVATE_KEY" ]; then
          umask 077
          printf '%s\n' "$PONWRT_APK_PRIVATE_KEY" > private-key.pem
          openssl ec -in private-key.pem -pubout -out public-key.pem
        fi

    # 加载自定义配置：复制为 openwrt/.config，勾选 use_ccache 时追加 CONFIG_CCACHE=y
    - name: Load custom config
      env:
        USE_CCACHE: ${{ inputs.use_ccache }}
      run: |
        [ -e files ] && mv files openwrt/files
        # 配置文件必须存在，缺了就报错退出。不要写成 [ -e $CONFIG_FILE ] && cp ... ：
        # bash -e 下 && 列表里失败的那个不是最后一个命令，set -e 不会终止步骤。
        # 后果是静默用默认配置编译，产出不含本项目软件包的固件还显示成功。
        if [ ! -e "$CONFIG_FILE" ]; then
          echo "::error::缺少编译配置文件 $CONFIG_FILE（应位于本仓库根目录）"
          exit 1
        fi
        cp "$CONFIG_FILE" openwrt/.config
        # 缓存开关落在 .config 里：rules.mk 读的是这个变量。
        # config CCACHE 是 `bool ... if DEVEL`，本配置已有 CONFIG_DEVEL=y，defconfig 不会丢掉。
        # 用 printf 且前置 \n：部分配置末行没有换行符，直接追加会粘成无效行被 kconfig 忽略。
        if [ "$USE_CCACHE" = "true" ]; then
          printf '\n%s\n' 'CONFIG_CCACHE=y' >> openwrt/.config
        fi
        chmod +x $SELF_AFTER_SH
        cd openwrt
        make defconfig
        # 兜底自检：开关被 defconfig 丢掉就直接失败，而不是白编一趟才发现命中率是 0
        if [ "$USE_CCACHE" = "true" ]; then
          grep -q '^CONFIG_CCACHE=y' .config || {
            echo "::error::CONFIG_CCACHE=y 没能进入 defconfig 结果，检查 $CONFIG_FILE 里是否有 CONFIG_DEVEL=y"
            exit 1
          }
        fi
        $GITHUB_WORKSPACE/$SELF_AFTER_SH

    # make download 预下载所有源码包，避免编译时网络超时
    - name: Download package
      id: package
      run: |
        cd openwrt
        make download -j8 V=11
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -f {} \;

    # 编译固件：优先多线程，失败回退单线程，再失败开详细日志。
    # 命令行不再传 CONFIG_CCACHE=y：缓存开关已由上步写进 .config。
    - name: Compile the firmware
      id: compile
      run: |
        cd openwrt
        echo -e "$(nproc) thread compile"
        make -j$(nproc) || make -j1 || make -j1 V=s || exit 1
        echo "status=success" >> $GITHUB_OUTPUT
        echo "FILE_DATE=_$(date +"%Y%m%d%H%M")" >> $GITHUB_ENV

    - name: Check space usage
      if: (!cancelled())
      run: df -hT

    # 整理固件文件：只复制 *.bin / *.itb 到 release/<设备>/ 散文件目录
    # SUBTARGET 由 Setup 步骤推导 (an7581 / an7583)，产物路径自动适配
    - name: Organize firmware files
      id: organize
      if: (!cancelled())
      run: |
        device="${DEVICE_NAME#_}"
        echo "DEVICE=$device" >> $GITHUB_ENV
        mkdir -p "release/$device"
        for f in openwrt/bin/targets/airoha/${SUBTARGET}/*.bin openwrt/bin/targets/airoha/${SUBTARGET}/*.itb; do
          [ -e "$f" ] || continue
          cp "$f" "release/$device/"
        done
        ls -l "release/$device"
        echo "status=success" >> $GITHUB_OUTPUT

    - name: Upload firmware directory
      uses: actions/upload-artifact@main
      if: steps.organize.outputs.status == 'success' && !cancelled()
      with:
        name: ImmortalWrt_firmware${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
        path: release/${{ env.DEVICE }}

  # Release 发布 job：编译完成后统一创建 Release
  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: build
    if: needs.build.result == 'success' && !cancelled()
    permissions:
      contents: write
      actions: write

    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts

    # 将设备散文件目录打包为 tar.zst，从 artifact 名反解设备名
    - name: Package firmware by device
      run: |
        mkdir -p release
        for d in artifacts/*/; do
          [ -d "$d" ] || continue
          name="$(basename "$d")"
          device="$(echo "$name" | sed -E 's/^ImmortalWrt_firmware_//; s/_[0-9]{12}$//')"
          tar --zstd -cf "release/immortalwrt-${device}.tar.zst" -C "$d" .
          echo "Packaged $device -> release/immortalwrt-${device}.tar.zst"
        done
        ls -l release/

    # 生成 Release 标签和说明，由 DEVICE_MODEL 和 SUBTARGET 自动填充
    - name: Generate release tag
      id: tag
      run: |
        echo "release_tag=ImmortalWrt_$(date +"%Y.%m.%d-%H%M")" >> $GITHUB_OUTPUT
        touch release.txt
        echo "ImmortalWrt for ${DEVICE_MODEL} (Airoha ${SUBTARGET^^})" >> release.txt
        echo "status=success" >> $GITHUB_OUTPUT

    - name: Upload firmware to release
      id: release
      uses: softprops/action-gh-release@v3
      if: steps.tag.outputs.status == 'success' && !cancelled()
      with:
        tag_name: ${{ steps.tag.outputs.release_tag }}
        body_path: release.txt
        files: release/*.tar.zst
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Delete workflow runs
      uses: Mattraks/delete-workflow-runs@v2
      with:
        token: ${{ github.token }}
        repository: ${{ github.repository }}
        retain_days: 7
        keep_minimum_runs: 3

    - name: Remove old Releases
      uses: dev-drprasad/delete-older-releases@v0.3.4
      if: steps.release.outputs.status == 'success' && !cancelled()
      with:
        keep_latest: 3
        delete_tags: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
