# ============================================================
# U-Boot 编译工作流
# 支持机型: 小米 AX3000T / CMCC RAX3000M (MT7981 平台)
# 使用矩阵策略并行编译各机型的不同硬件版本
# 触发方式: 手动触发 (workflow_dispatch)
# ============================================================

name: Build U-Boot (MT7981)

on:
  # 定时编译 (默认关闭，取消注释即可启用，cron 使用 UTC 时间)
  # schedule:  
  #   - cron: "0 2 15 * *"
  # 手动触发：可在 GitHub Actions 页面点击 "Run workflow" 按钮
  workflow_dispatch:

env:
  # U-Boot 源码仓库地址 (hanwckf 的 MT798x bootloader)
  REPO_URL: https://github.com/hanwckf/bl-mt798x.git
  # 源码分支
  REPO_BRANCH: master
  # 编译环境时区
  TZ: Asia/Shanghai

jobs:
  build:
    name: Build U-Boot
    runs-on: ubuntu-latest

    permissions:
      actions: write    # 允许上传编译产物 artifact

    # ----------------------------------------------------------
    # 矩阵策略: 定义需要编译的 board 列表
    # 每个 board 会在独立的 runner 上并行编译
    #
    # AX3000T 系列:
    #   - ax3000t:        标准版 (内置交换芯片)
    #   - ax3000t_an8855: AN8855 外置交换芯片版本
    #
    # RAX3000M 系列:
    #   - cmcc_rax3000m:       SPI-NAND 闪存版本
    #   - cmcc_rax3000m-emmc:  eMMC 闪存版本
    #
    # multi_layout 说明:
    #   MULTI_LAYOUT=1 时 build.sh 会选用 <soc>_<board>_multi_layout_defconfig,
    #   但上游 bl-mt798x 仅为 ax3000t 系列提供该配置, cmcc_rax3000m 没有,
    #   因此 RAX3000M 必须使用 multi_layout=0, 否则 build.sh 报 defconfig not found。
    # ----------------------------------------------------------
    strategy:
      matrix:
        include:
          - board: ax3000t
            multi_layout: 1
          - board: ax3000t_an8855
            multi_layout: 1
          - board: cmcc_rax3000m
            multi_layout: 0
          - board: cmcc_rax3000m-emmc
            multi_layout: 0

    steps:

      # - name: Free disk space (Ubuntu)
      #   uses: jlumbroso/free-disk-space@main
      #   with:
      #     tool-cache: false
      #     android: true
      #     dotnet: true
      #     haskell: true
      #     large-packages: true
      #     swap-storage: false

      # ----------------------------------------------------------
      # 步骤 1: 检出本仓库代码
      # ----------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@main

      # ----------------------------------------------------------
      # 步骤 2: 初始化编译环境
      # 安装交叉编译工具链 (aarch64-linux-gnu) 和编译依赖
      # MT7981 是 ARM64 架构，需要 aarch64 交叉编译器
      # ----------------------------------------------------------
      - name: Initialization environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          # gcc-aarch64-linux-gnu: ARM64 交叉编译器
          # flex/bison: 词法/语法分析器 (用于生成 bootloader 解析代码)
          # libssl-dev: OpenSSL 开发库 (用于签名/加密功能)
          # device-tree-compiler: 设备树编译器 (将 .dts 编译为 .dtb)
          sudo -E apt-get -qq install gcc-aarch64-linux-gnu build-essential flex bison libssl-dev device-tree-compiler

          sudo -E apt-get -qq autoremove --purge
          sudo -E apt-get -qq clean

          sudo timedatectl set-timezone "$TZ"
          
          sudo mkdir -p /srcdir
          sudo chown $USER:$GROUPS /srcdir

      # ----------------------------------------------------------
      # 步骤 3: 克隆 U-Boot 源码
      # 克隆到 /srcdir 并通过软链接关联到工作区
      # ----------------------------------------------------------
      - name: Clone Source Repository
        working-directory: /srcdir
        run: |
           echo "Free space:"
            df -hT $PWD
            git clone $REPO_URL -b $REPO_BRANCH u-boot
            ln -sf /srcdir/u-boot $GITHUB_WORKSPACE/u-boot      

      # ----------------------------------------------------------
      # 步骤 4: 编译 U-Boot
      # SOC=mt7981:            指定 SoC 型号为 MT7981 (Filogic 820)
      # BOARD=<matrix>:        当前矩阵中的 board 名称
      # MULTI_LAYOUT=<matrix>: 是否使用多分区布局 defconfig (见矩阵说明)
      # FIXED_MTDPARTS=1:      使用固定的 MTD 分区表
      # ----------------------------------------------------------
      - name: Compile U-Boot
        id: compile
        run: |
          cd u-boot
          SOC=mt7981 BOARD=${{ matrix.board }} MULTI_LAYOUT=${{ matrix.multi_layout }} FIXED_MTDPARTS=1 ./build.sh
          
          echo "FILE_DATE=_$(date +"%Y%m%d%H%M")" >> $GITHUB_ENV
          echo "status=success" >> $GITHUB_OUTPUT

      # ----------------------------------------------------------
      # 步骤 5: 按 board 打包编译产物为独立压缩包
      # 每个 matrix job 只编译一个 board, 将其 output 目录打包为 tar.zst
      # ----------------------------------------------------------
      - name: Package U-Boot by board
        id: package
        if: steps.compile.outputs.status == 'success' && !cancelled()
        run: |
          mkdir -p release
          tar --zstd -cf "release/${{ matrix.board }}.tar.zst" -C u-boot/output .
          echo "Packaged ${{ matrix.board }} -> release/${{ matrix.board }}.tar.zst"
          echo "status=success" >> $GITHUB_OUTPUT

      # ----------------------------------------------------------
      # 步骤 6: 上传编译产物为 artifact
      # 每个 board 的压缩包单独上传, 由下方 release job 统一汇总发布
      # ----------------------------------------------------------
      - name: Upload U-Boot package
        uses: actions/upload-artifact@main
        if: steps.package.outputs.status == 'success' && !cancelled()
        with:
          name: u-boot_${{ matrix.board }}${{ env.FILE_DATE }}
          path: release/${{ matrix.board }}.tar.zst

  # ------------------------------------------------------------
  # Release 发布 job
  # 等待全部 board 编译完成后统一创建 Release,
  # 避免 matrix 并行 job 各自调用 Release API 造成同 tag 重复建 Release
  # ------------------------------------------------------------
  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: build
    if: needs.build.result == 'success' && !cancelled()

    permissions:
      contents: write   # 允许创建 Release
      actions: write    # 允许删除/管理 workflow runs

    steps:

      # ----------------------------------------------------------
      # 步骤 1: 下载本次 run 的全部 artifact
      # 不指定 name 时下载所有 artifact, 每个解压到以其名称命名的子目录
      # ----------------------------------------------------------
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      # ----------------------------------------------------------
      # 步骤 2: 汇总各 board 压缩包到 release 目录
      # ----------------------------------------------------------
      - name: Organize release files
        run: |
          mkdir -p release
          mv artifacts/*/*.tar.zst release/
          ls -l release/

      # ----------------------------------------------------------
      # 步骤 3: 生成 Release 标签和说明
      # 标签格式: U-Boot_年.月.日-时分
      # ----------------------------------------------------------
      - name: Generate release tag
        id: tag
        run: |
          echo "release_tag=U-Boot_$(date +"%Y.%m.%d-%H%M")" >> $GITHUB_OUTPUT
          touch release.txt
          echo "U-Boot for Xiaomi AX3000T & CMCC RAX3000M" >> release.txt
          echo "status=success" >> $GITHUB_OUTPUT

      # ----------------------------------------------------------
      # 步骤 4: 上传全部 U-Boot 压缩包到 GitHub Release
      # 单一 job 创建 Release, 保证同 tag 只有一个 Release
      # ----------------------------------------------------------
      - name: Upload U-Boot to release
        id: release
        uses: softprops/action-gh-release@v3
        if: steps.tag.outputs.status == 'success' && !cancelled()
        with:
          tag_name: ${{ steps.tag.outputs.release_tag }}
          body_path: release.txt
          files: release/*.tar.zst
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ----------------------------------------------------------
      # 步骤 5: 清理旧的 workflow runs
      # 保留最近 7 天的运行记录，至少保留 3 条
      # ----------------------------------------------------------
      - name: Delete workflow runs
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          retain_days: 7
          keep_minimum_runs: 3

      # ----------------------------------------------------------
      # 步骤 6: 清理旧的 GitHub Releases
      # 保留最近 3 个 Release，删除旧的 Release 及其 tag
      # ----------------------------------------------------------
      - name: Remove old Releases
        uses: dev-drprasad/delete-older-releases@v0.3.4
        if: steps.release.outputs.status == 'success' && !cancelled()
        with:
          keep_latest: 3
          delete_tags: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
