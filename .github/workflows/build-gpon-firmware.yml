# ============================================================
# ImmortalWrt 固件编译工作流
# 支持机型: Nokia XG-040G-MD (Airoha AN7581 平台)
# 源码来源: https://github.com/DenzelVicent/ponwrt.git
# 触发方式: 手动触发 (workflow_dispatch)
# ============================================================

name: Build ImmortalWrt Firmware (AN7581 GPON)
on:
  # 定时编译 (默认关闭，取消注释即可启用，cron 使用 UTC 时间)
  # schedule:
  #   - cron: "0 21 * * *"
  # 手动触发：可在 GitHub Actions 页面点击 "Run workflow" 按钮
  workflow_dispatch:
    inputs:
      # ccache 编译对象缓存开关（和上面的选分支一样在触发表单里勾选）
      # 开启方式是把 CONFIG_CCACHE=y 追加进 openwrt/.config，而不是往 make 命令行传参数：
      # rules.mk 的 `ifneq ($(CONFIG_CCACHE),)` 读的就是 .config 里的这个 make 变量，
      # 两条路最终等价，但传参数会让"开关"和"Cache ccache 步骤"两处状态各写一次，容易改一漏一。
      # 关闭时 Cache ccache 步骤整体跳过，既不恢复也不保存 openwrt/.ccache。
      # 注意：boolean 的 default 只作用于网页表单；用 API 或 schedule 触发且未显式传 inputs
      # 时取到空值，等同于关闭缓存。
      use_ccache:
        description: 启用 ccache 编译对象缓存（首次冷编译、或怀疑产物不对需排除 ccache 时关掉）
        type: boolean
        default: true

env:
  # 源码仓库地址
  REPO_URL: https://github.com/DenzelVicent/ponwrt.git
  # 源码分支 (GPON 相关内核 patch 仅存在于 ponwrt 的 AN7581-gpon 分支)
  REPO_BRANCH: AN7581-gpon
  # 自定义固件配置文件 (OpenWrt make menuconfig 生成，按设备型号命名)
  # 工作流把它复制成 openwrt/.config。按型号命名是为了和"编译期真正的 .config"区分开，
  # 也避免和 configs/ 下那份从源码仓库拷来的参考配置撞名。
  CONFIG_FILE: an7581-gpon.config
  # feeds 更新前执行的自定义脚本 (可用于添加第三方软件源)
  SELF_BEFORE_SH: before-update-custom.sh
  # feeds 更新后执行的自定义脚本 (可用于修改默认 IP、DHCP 等配置)
  SELF_AFTER_SH: after-update-custom.sh
  # 编译环境时区
  TZ: Asia/Shanghai
  # 可选覆盖：本仓库根目录存在该文件时才 mv 覆盖源码自带 feeds，当前不存在
  # (GPON 的 fork feed 源在 PonWrt AN7581-gpon 分支的 feeds.conf.default 里)
  FEEDS_CONF: feeds.conf.default

jobs:
  build:
    name: build-firmware
    runs-on: ubuntu-24.04

    permissions:
      actions: write    # 允许上传编译产物 artifact

    steps:
    # ----------------------------------------------------------
    # 步骤 1: 释放磁盘空间
    # 删除 Ubuntu runner 上不常用的工具链 (Android/.NET/Haskell 等)
    # 可释放约 6GB 空间，确保编译不会因磁盘不足而失败
    # ----------------------------------------------------------
    - name: Free disk space (Ubuntu)
      uses: jlumbroso/free-disk-space@main
      with:
        tool-cache: false
        android: true
        dotnet: true
        haskell: true
        large-packages: true
        swap-storage: false

    # ----------------------------------------------------------
    # 步骤 2: 检出本仓库代码
    # 将配置文件、自定义脚本等文件拉取到工作区
    # ----------------------------------------------------------
    - name: Checkout
      uses: actions/checkout@main

    # ----------------------------------------------------------
    # 步骤 3: 安装编译依赖
    # ImmortalWrt 需要 ubuntu-24.04 和完整工具链
    # ----------------------------------------------------------
    - name: Install build dependencies
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          asciidoc autoconf automake autopoint binutils bison build-essential \
          bzip2 ccache clang cmake cpio curl device-tree-compiler flex gawk \
          gettext git g++-multilib gcc-multilib gperf help2man intltool \
          libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev \
          libmpfr-dev libncurses-dev libpython3-dev libreadline-dev libssl-dev \
          libtool libyaml-dev lld llvm ninja-build p7zip-full patch pkgconf \
          python3 python3-docutils python3-pip python3-ply python3-pyelftools \
          qemu-utils re2c rsync scons squashfs-tools subversion swig texinfo \
          uglifyjs unzip wget xmlto xxd zlib1g-dev zstd
        sudo -E apt-get -qq autoremove --purge
        sudo -E apt-get -qq clean
        sudo timedatectl set-timezone "$TZ"
        sudo mkdir -p /srcdir
        sudo chown $USER:$GROUPS /srcdir

    # ----------------------------------------------------------
    # 步骤 4: 克隆 ImmortalWrt 源码
    # 将源码克隆到 /srcdir 以获得更大的磁盘空间
    # 并通过软链接关联到工作区
    # ----------------------------------------------------------
    - name: Clone source code
      working-directory: /srcdir
      run: |
        echo "Free space:"
        df -hT $PWD
        git clone $REPO_URL -b $REPO_BRANCH openwrt
        ln -sf /srcdir/openwrt $GITHUB_WORKSPACE/openwrt

    # ----------------------------------------------------------
    # 步骤 5: 缓存下载目录 (dl/) + ccache
    # 缓存软件包源码和编译对象，加速重复构建
    # dl 缓存: 源码包不变则不重新下载
    # ccache 缓存: 未修改的 C/C++ 源文件编译结果复用；由触发表单的 use_ccache 控制
    #
    # key 带仓库根的设备配置文件，外加可选的 feeds.conf.default。后者本仓库当前没有
    # （GPON 的 feed 源由 PonWrt 分支自带），hashFiles 对缺失项不产生任何贡献，所以它
    # 现在不参与计算；留着是为了以后真在根目录放入该文件时能自动让缓存失效——缓存步骤
    # 排在 Load custom feeds 的 mv 之前，那时根目录那份文件还在，取得到。
    #
    # 真出过问题的是 `.config` 这个参数：它改名后指向不存在的文件，两个参数全空时
    # hashFiles 返回"空文件集"的固定哈希，dl 与 ccache 两条 key 算出同一个值
    # (4a099bcd9192f8235c5813fe18188a4c5111148337490c8c1fe90edb2d1faf36)，
    # 等于 key 退化成常量前缀、改配置也不会失效。改回真实文件名后动配置就是换 key。
    #
    # ccache 路径必须是 openwrt/.ccache，不能写 ~/.ccache：
    # rules.mk 里 CCACHE_DIR 默认取 $(TOPDIR)/.ccache，而设备配置的
    # CONFIG_CCACHE_DIR 为空串，所以编译实际写入的是 openwrt/.ccache。
    # 此前缓存 ~/.ccache 时两边不是同一目录，命中率恒为 0，白付 ccache 开销。
    # 改这里而不是给每条 make 行加 CONFIG_CCACHE_DIR，是为了让新增 make 调用
    # 也不会漏掉；命中率看构建日志末尾的 `ccache -s`（Makefile world 目标自带）。
    # ----------------------------------------------------------
    - name: Cache downloads
      uses: actions/cache@v4
      with:
        path: openwrt/dl
        key: immortalwrt-dl-${{ hashFiles('feeds.conf.default', 'an7581-gpon.config') }}
        restore-keys: |
          immortalwrt-dl-

    - name: Cache ccache
      if: ${{ inputs.use_ccache }}
      uses: actions/cache@v4
      with:
        path: openwrt/.ccache
        key: immortalwrt-ccache-${{ hashFiles('feeds.conf.default', 'an7581-gpon.config') }}
        restore-keys: |
          immortalwrt-ccache-

    # ----------------------------------------------------------
    # 步骤 6: 加载 feeds 源
    # GPON 所需的 pon_drivers / pon_userspace 两个 fork 源由 PonWrt 的
    # AN7581-gpon 分支自带，本仓库不放 feeds.conf.default 去覆盖，避免源码
    # 与编译配置耦合；仅当根目录存在该文件时才 mv 覆盖
    # 然后执行 before-update-custom.sh (可添加第三方 feed)
    # ----------------------------------------------------------
    - name: Load custom feeds
      run: |
        [ -e $FEEDS_CONF ] && mv $FEEDS_CONF openwrt/feeds.conf.default
        chmod +x $SELF_BEFORE_SH
        cd openwrt
        $GITHUB_WORKSPACE/$SELF_BEFORE_SH

    # ----------------------------------------------------------
    # 步骤 7: 更新 feeds
    # 从各 feed 源拉取最新的软件包定义
    # ----------------------------------------------------------
    - name: Update feeds
      run: cd openwrt && ./scripts/feeds update -a

    # ----------------------------------------------------------
    # 步骤 8: 安装 feeds
    # 将更新后的 feed 软件包安装到编译环境中
    # ----------------------------------------------------------
    - name: Install feeds
      run: cd openwrt && ./scripts/feeds install -a

    # ----------------------------------------------------------
    # 步骤 8.5: 克隆第三方包 (非 feed 格式)
    # 必须在 feeds install 之后: 此时 luci-base 等 feed 包已安装为符号链接,
    # 后续 make defconfig 才能正确解析 +luci-base 等运行时依赖
    # ----------------------------------------------------------
    - name: Clone custom packages
      working-directory: openwrt
      run: |
        # Lucky (IPv6 端口转发/DDNS/公网访问)
        git clone --depth 1 https://github.com/gdy666/luci-app-lucky.git package/luci-app-lucky || {
            echo "::warning::luci-app-lucky 克隆失败，该插件将不会包含在固件中"
        }
        # Airoha NPU 管理界面 (AN7581 平台专用)
        git clone --depth 1 https://github.com/DenzelVicent/luci-app-airoha-npu.git package/luci-app-airoha-npu || {
            echo "::error::luci-app-airoha-npu 克隆失败，NPU 管理界面将不会包含在固件中"
        }
        echo "=== 第三方包目录检查 ==="
        for d in package/luci-app-lucky package/luci-app-airoha-npu; do
            [ -d "$d" ] && echo "[OK] $d" || echo "[MISSING] $d"
        done

    # ----------------------------------------------------------
    # 步骤 9: 加载仓库签名密钥 (APK)
    # 用于对编译产物的软件包进行签名验证
    # 需在仓库 Settings → Secrets 中配置 PONWRT_APK_PRIVATE_KEY
    # 未配置时跳过，不影响编译
    # ----------------------------------------------------------
    - name: Load repository signing key
      working-directory: openwrt
      env:
        PONWRT_APK_PRIVATE_KEY: ${{ secrets.PONWRT_APK_PRIVATE_KEY }}
      run: |
        if [ -n "$PONWRT_APK_PRIVATE_KEY" ]; then
          umask 077
          printf '%s\n' "$PONWRT_APK_PRIVATE_KEY" > private-key.pem
          openssl ec -in private-key.pem -pubout -out public-key.pem
        fi

    # ----------------------------------------------------------
    # 步骤 10: 加载自定义配置
    # 将设备配置复制为 openwrt/.config 作为编译配置（用 cp 不用 mv：留着仓库根那份
    # 在工作区里，后面若还要排查 key 或复跑步骤都还能看到原始输入）
    # 触发表单勾选 use_ccache 时，在这里追加 CONFIG_CCACHE=y，make 命令行不再带参数
    # 如果存在 files/ 目录则复制到 openwrt/files/ 作为固件内预置文件
    # make defconfig 根据 .config 生成完整配置
    # 最后执行 after-update-custom.sh (修改默认 IP、DHCP 范围等)
    # ----------------------------------------------------------
    - name: Load custom config
      env:
        USE_CCACHE: ${{ inputs.use_ccache }}
      run: |
        [ -e files ] && mv files openwrt/files
        # 配置文件必须存在，缺了就报错退出。不要写成 [ -e $CONFIG_FILE ] && cp ... ：
        # Actions 默认 shell 是 bash -e，而 && 列表里失败的那个不是最后一个命令，
        # set -e 不会终止步骤（已实测：文件不存在时后续命令照跑）。
        # 后果是静默用源码仓库的默认配置编译满一个钟头，产出不含本项目软件包的固件还显示成功。
        if [ ! -e "$CONFIG_FILE" ]; then
          echo "::error::缺少编译配置文件 $CONFIG_FILE（应位于本仓库根目录，检查工作流 CONFIG_FILE 与分支上的文件名是否一致）"
          exit 1
        fi
        cp "$CONFIG_FILE" openwrt/.config
        # 缓存开关落在 .config 里：rules.mk 的 ifneq ($(CONFIG_CCACHE),) 读的就是这个变量，
        # 与从前在 make 行传 CONFIG_CCACHE=y 等价。config CCACHE 是 `bool ... if DEVEL`，
        # 本配置文件已有 CONFIG_DEVEL=y，符号可见，所以下面的 make defconfig 不会丢掉它。
        # 用 printf 且前置 \n：部分设备配置末行没有换行符，直接追加会和最后一行粘成
        # 一条无效行被 kconfig 静默忽略，开关等于没开。
        if [ "$USE_CCACHE" = "true" ]; then
          printf '\n%s\n' 'CONFIG_CCACHE=y' >> openwrt/.config
        fi
        chmod +x $SELF_AFTER_SH
        cd openwrt
        make defconfig
        # 兜底自检：开关被 defconfig 丢掉就直接失败，而不是白编一趟才发现命中率是 0
        if [ "$USE_CCACHE" = "true" ]; then
          grep -q '^CONFIG_CCACHE=y' .config || {
            echo "::error::CONFIG_CCACHE=y 没能进入 defconfig 结果，检查 $CONFIG_FILE 里是否有 CONFIG_DEVEL=y"
            exit 1
          }
        fi
        $GITHUB_WORKSPACE/$SELF_AFTER_SH

    # ----------------------------------------------------------
    # 步骤 11: 下载编译所需的软件包源码
    # make download 预下载所有源码包，避免编译时网络超时
    # 清理小于 1024 字节的下载失败文件
    # ----------------------------------------------------------
    - name: Download package
      id: package
      run: |
        cd openwrt
        make download -j8 V=11
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -f {} \;

    # ----------------------------------------------------------
    # 步骤 12: 编译固件
    # 优先使用全部 CPU 核心并行编译，失败后回退到单线程
    # 单线程仍失败则开启详细日志 (V=s) 便于排查
    # 命令行不再传 CONFIG_CCACHE=y：缓存开关已由步骤 10 按触发表单写进 .config，
    # 回退的三条 make 都读同一份 .config，不必各带一遍参数。
    # ----------------------------------------------------------
    - name: Compile the firmware
      id: compile
      run: |
        cd openwrt
        echo -e "$(nproc) thread compile"
        # 多级回退编译; 全部失败时必须让步骤报错, 否则后续无产物却显示成功
        make -j$(nproc) || make -j1 || make -j1 V=s || exit 1
        echo "status=success" >> $GITHUB_OUTPUT
        echo "DEVICE_NAME=_nokia-xg-040g-md" >> $GITHUB_ENV
        echo "FILE_DATE=_$(date +"%Y%m%d%H%M")" >> $GITHUB_ENV

    # ----------------------------------------------------------
    # 步骤 13: 检查磁盘使用情况
    # ----------------------------------------------------------
    - name: Check space usage
      if: (!cancelled())
      run: df -hT

    # ----------------------------------------------------------
    # 步骤 14: 整理固件文件
    # 只复制可刷写的固件镜像 (*.bin / *.itb) 到 release/<设备>/ 散文件目录
    # manifest/buildinfo/sha256sums/json 等非固件附属文件不保留
    # tar.zst 打包移至下方 release job 下载 artifact 后统一执行
    # ----------------------------------------------------------
    - name: Organize firmware files
      id: organize
      if: (!cancelled())
      run: |
        device="${DEVICE_NAME#_}"
        echo "DEVICE=$device" >> $GITHUB_ENV
        mkdir -p "release/$device"
        for f in openwrt/bin/targets/airoha/an7581/*.bin openwrt/bin/targets/airoha/an7581/*.itb; do
          [ -e "$f" ] || continue
          cp "$f" "release/$device/"
        done
        ls -l "release/$device"
        echo "status=success" >> $GITHUB_OUTPUT

    # ----------------------------------------------------------
    # 步骤 15: 上传固件散文件目录为 artifact
    # 下载后直接是各固件文件, 便于单独取用; tar.zst 打包由 release job 执行
    # ----------------------------------------------------------
    - name: Upload firmware directory
      uses: actions/upload-artifact@main
      if: steps.organize.outputs.status == 'success' && !cancelled()
      with:
        name: ImmortalWrt_firmware${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
        path: release/${{ env.DEVICE }}

  # ------------------------------------------------------------
  # Release 发布 job
  # 编译完成后统一创建 Release, 与 MT7981 两个工作流结构保持一致
  # ------------------------------------------------------------
  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: build
    if: needs.build.result == 'success' && !cancelled()

    permissions:
      contents: write   # 允许创建 Release
      actions: write    # 允许删除/管理 workflow runs

    steps:

      # ----------------------------------------------------------
      # 步骤 1: 下载本次 run 的全部 artifact
      # 不指定 name 时下载所有 artifact, 每个解压到以其名称命名的子目录
      # ----------------------------------------------------------
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      # ----------------------------------------------------------
      # 步骤 2: 将设备散文件目录打包为 tar.zst 汇总到 release 目录
      # artifact 名格式 ImmortalWrt_firmware_<设备>_<日期>, 从中反解设备名
      # 压缩包名沿用上游形态 immortalwrt-<设备>.tar.zst
      # ----------------------------------------------------------
      - name: Package firmware by device
        run: |
          mkdir -p release
          for d in artifacts/*/; do
            [ -d "$d" ] || continue
            name="$(basename "$d")"
            device="$(echo "$name" | sed -E 's/^ImmortalWrt_firmware_//; s/_[0-9]{12}$//')"
            tar --zstd -cf "release/immortalwrt-${device}.tar.zst" -C "$d" .
            echo "Packaged $device -> release/immortalwrt-${device}.tar.zst"
          done
          ls -l release/

      # ----------------------------------------------------------
      # 步骤 3: 生成 Release 标签和说明
      # 标签格式: ImmortalWrt_年.月.日-时分
      # ----------------------------------------------------------
      - name: Generate release tag
        id: tag
        run: |
          echo "release_tag=ImmortalWrt_$(date +"%Y.%m.%d-%H%M")" >> $GITHUB_OUTPUT
          touch release.txt
          echo "ImmortalWrt for Nokia XG-040G-MD (Airoha AN7581)" >> release.txt
          echo "status=success" >> $GITHUB_OUTPUT

      # ----------------------------------------------------------
      # 步骤 4: 上传固件压缩包到 GitHub Release
      # ----------------------------------------------------------
      - name: Upload firmware to release
        id: release
        uses: softprops/action-gh-release@v3
        if: steps.tag.outputs.status == 'success' && !cancelled()
        with:
          tag_name: ${{ steps.tag.outputs.release_tag }}
          body_path: release.txt
          files: release/*.tar.zst
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ----------------------------------------------------------
      # 步骤 5: 清理旧的 workflow runs
      # 保留最近 7 天的运行记录，至少保留 3 条
      # ----------------------------------------------------------
      - name: Delete workflow runs
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          retain_days: 7
          keep_minimum_runs: 3

      # ----------------------------------------------------------
      # 步骤 6: 清理旧的 GitHub Releases
      # 保留最近 3 个 Release，删除旧的 Release 及其 tag
      # ----------------------------------------------------------
      - name: Remove old Releases
        uses: dev-drprasad/delete-older-releases@v0.3.4
        if: steps.release.outputs.status == 'success' && !cancelled()
        with:
          keep_latest: 3
          delete_tags: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
